name: Update grocery prices

on:
  schedule:
    # Twice a month (1st and 15th, 10:00 UTC). Cron has no real "every 2 weeks", and
    # this is the closest honest approximation. A full pass over three stores is a
    # few hours, so a daily run was far more crawling than the data needs.
    - cron: '0 10 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Seasons runs fine on the bundled Chromium. Gourmet Glatt sits behind a bot check
      # that rejects Playwright's headless shell, so it needs real Chrome (channel:'chrome').
      - name: Install browsers for Playwright
        run: npx playwright install --with-deps chromium chrome

      # Gourmet Glatt runs headed, which needs a display on a headless runner.
      # If it gets challenged here anyway, scrape.js carries forward its previous
      # records rather than publishing an empty store.
      - name: Run scrapers
        run: xvfb-run -a npm run scrape

      - name: Commit updated prices
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices ($(date -u +%Y-%m-%d))"
            git push
          fi
